name: Native VHDX inputs
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/vhdx_cli.rs'
      - 'tests/vhdx_native.rs'
      - 'test_files/vhdx/**'
      - '.github/workflows/vhdx.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        # The existing Rust workflow runs the complete suite on Windows.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test native image scanning without FUSE or extraction
        run: cargo test --locked --test vhdx_cli --test vhdx_native -- --test-threads=1
